[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nitro-ai-judge-cli"
version = "3.1.4"
description = "CLI client for judge.nitro-ai.org"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual>=8.2,<9"]
authors = [
  { name = "Mihnea-Teodor Stoica" }
]
keywords = ["nitro", "cli", "judge", "competitions"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]

[project.optional-dependencies]
manager = ["aiohttp>=3.10,<4"]

[project.urls]
Homepage = "https://github.com/MihneaTeodorStoica/nitro-ai-judge-cli"
Repository = "https://github.com/MihneaTeodorStoica/nitro-ai-judge-cli"
Issues = "https://github.com/MihneaTeodorStoica/nitro-ai-judge-cli/issues"

[project.scripts]
naij = "nitro_ai_judge_cli.cli:main"
nitro-cli = "nitro_ai_judge_cli.cli:legacy_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nitro_ai_judge_cli.manager" = ["assets/*"]

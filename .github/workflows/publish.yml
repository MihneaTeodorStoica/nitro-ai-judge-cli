name: Build and Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  MANAGER_IMAGE: ghcr.io/mihneateodorstoica/naij-play-manager

jobs:
  host-test:
    name: Host tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CLI and manager test dependencies
        run: python -m pip install ".[manager]" "jsonschema>=4,<5" "openapi-spec-validator>=0.7,<1"
      - name: Run unit and Textual Pilot tests
        run: python -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag and package version agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - name: Build and check CLI distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Install and smoke-test wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          naij --help >/tmp/naij-help
          nitro-cli --help >/tmp/nitro-cli-help 2>/tmp/nitro-cli-warning
          python -m nitro_ai_judge_cli --help >/tmp/naij-module-help
          cmp /tmp/naij-help /tmp/nitro-cli-help
          cmp /tmp/naij-help /tmp/naij-module-help
          test "$(cat /tmp/nitro-cli-warning)" = 'warning: `nitro-cli` is deprecated; use `naij`. It will be removed in 4.0.0.'
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$(naij --version)" = "naij ${VERSION}"
          test "$(python -m nitro_ai_judge_cli --version)" = "naij ${VERSION}"
          test "$(nitro-cli --version 2>/tmp/nitro-cli-version-warning)" = "naij ${VERSION}"
          test "$(cat /tmp/nitro-cli-version-warning)" = 'warning: `nitro-cli` is deprecated; use `naij`. It will be removed in 4.0.0.'
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  manager-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build manager image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: manager/Dockerfile
          load: true
          tags: naij-play-manager:ci
      - name: Smoke-test image tools and entrypoint
        run: |
          docker run --rm --entrypoint docker naij-play-manager:ci compose version
          docker run --rm --entrypoint python naij-play-manager:ci -c "import aiohttp, nitro_ai_judge_cli.manager"
      - name: Build and smoke-test ARM64 manager image under QEMU
        uses: docker/build-push-action@v6
        with:
          context: .
          file: manager/Dockerfile
          platforms: linux/arm64
          load: true
          tags: naij-play-manager:ci-arm64
      - name: Smoke-test ARM64 image tools and entrypoint
        run: |
          docker run --rm --platform linux/arm64 --entrypoint docker naij-play-manager:ci-arm64 compose version
          docker run --rm --platform linux/arm64 --entrypoint python naij-play-manager:ci-arm64 -c "import aiohttp, nitro_ai_judge_cli.manager"
      - name: Start ARM64 entrypoint and verify health and identity (emulated)
        shell: bash
        run: |
          TOKEN_FILE="$(mktemp)"
          chmod 600 "$TOKEN_FILE"
          openssl rand -hex 32 > "$TOKEN_FILE"
          CID=""
          trap 'test -z "$CID" || docker rm -f "$CID"; rm -f "$TOKEN_FILE"' EXIT
          CID="$(docker run -d --platform linux/arm64 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$TOKEN_FILE":/run/naij-token:ro \
            -e NAIJ_MANAGER_API_TOKEN_FILE=/run/naij-token \
            naij-play-manager:ci-arm64)"
          for attempt in $(seq 1 45); do
            if timeout 15s docker exec "$CID" python -c "import json, urllib.request; base='http://localhost:51123/nitro/api/v1/'; assert json.load(urllib.request.urlopen(base+'health', timeout=3))['status']=='healthy'; info=json.load(urllib.request.urlopen(base+'info', timeout=3)); assert info['api_version']==1; assert info['identity']=='naij-play-manager'"; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$CID"
          exit 1

  docker-integration:
    runs-on: ubuntu-latest
    needs: manager-build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[manager]"
      - run: docker build -f manager/Dockerfile -t naij-play-manager:dev .
      - name: Run opt-in Docker manager integration
        env:
          NAIJ_DOCKER_INTEGRATION: "1"
          NAIJ_PLAY_MANAGER_IMAGE: naij-play-manager:dev
        run: python -m unittest discover -s tests/integration -v

  edge:
    if: github.ref == 'refs/heads/main'
    needs: [host-test, build, manager-build, docker-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: manager/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.MANAGER_IMAGE }}:edge

  manager-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-test, build, manager-build, docker-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable and mutable tags
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MINOR="$(echo "${VERSION}" | cut -d. -f1-2)"
          echo "version=${VERSION}" >>"${GITHUB_OUTPUT}"
          echo "minor=${MINOR}" >>"${GITHUB_OUTPUT}"
      - name: Refuse to overwrite the immutable exact tag
        shell: bash
        run: |
          if docker buildx imagetools inspect "${MANAGER_IMAGE}:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Immutable manager tag already exists" >&2
            exit 1
          fi
      - name: Publish immutable multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: manager/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.MANAGER_IMAGE }}:${{ steps.version.outputs.version }}
      - name: Update mutable release tags after exact image succeeds
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "${MANAGER_IMAGE}:${{ steps.version.outputs.minor }}" \
            --tag "${MANAGER_IMAGE}:stable" \
            "${MANAGER_IMAGE}:${{ steps.version.outputs.version }}"

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: manager-publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/nitro-ai-judge-cli
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [manager-publish, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub release after package publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES="docs/release-notes-${GITHUB_REF_NAME#v}.md"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file "$NOTES" --latest
          else
            gh release create "${GITHUB_REF_NAME}" --notes-file "$NOTES" --verify-tag --latest
          fi
